<text x="614" y="426" font-size="20" font-weight="700" fill="#e7edf5">Do one task</text>
<text x="584" y="454" font-size="13.5" fill="#8fa3b8">Do that one task. Check how the result works.</text>
<rect x="598" y="504" width="96" height="42" rx="8" fill="#4ade80"/>
<text x="646" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1018">one task</text>
<line x1="698" y1="525" x2="742" y2="525" stroke="#8fa3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="750" y="478" width="180" height="94" rx="8" fill="#0b1018" stroke="#2b3a4d" stroke-width="1.5"/>
<text x="764" y="499" font-size="10.5" font-weight="700" fill="#8fa3b8" letter-spacing="1">WHAT HAPPENED</text>
<text x="766" y="522" font-size="13" font-weight="700" fill="#4ade80">✓</text>
<text x="784" y="522" font-size="13" fill="#e7edf5">tests pass</text>
<text x="766" y="541" font-size="13" font-weight="700" fill="#4ade80">✓</text>
<text x="784" y="541" font-size="13" fill="#e7edf5">result checked</text>
<text x="766" y="560" font-size="13" font-weight="700" fill="#f5b942">?</text>
<text x="784" y="560" font-size="13" fill="#e7edf5">open question</text>
<text x="760.0" y="610" text-anchor="middle" font-size="12.5" fill="#8fa3b8">look at how it works, in addition to the tests</text>
<rect x="40" y="388" width="400" height="236" rx="14" fill="#111a26" stroke="#2b3a4d" stroke-width="1.5"/>
<circle cx="70" cy="420" r="14" fill="none" stroke="#67e8df" stroke-width="1.8"/>
<text x="70" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#67e8df">4</text>
